name: Publish website

# Publishes docs/ to GitHub Pages: after every daily run, whenever the site files change, or by hand.
on:
  workflow_run:
    workflows: ["Daily run"]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # the daily run's fresh commit, not the commit that started it
      # a daily run that changed nothing leaves main where it started: nothing new to publish
      - id: chk
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "Nothing new since the run started; skipping publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chk.outputs.new == 'true'
        uses: actions/configure-pages@v6
      - if: steps.chk.outputs.new == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        if: steps.chk.outputs.new == 'true'
        uses: actions/deploy-pages@v5
