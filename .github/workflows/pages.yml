name: Publish website

# Publishes docs/ to GitHub Pages: after every daily run, whenever the site files change, or by hand.
on:
  workflow_run:
    workflows: ["Daily run"]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # the daily run's fresh commit, not the commit that started it
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      # One-time cleanup: a publish got stuck during the repo rename (Nov 5) and blocks new ones.
      - name: Clear stuck publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/deployments/c5bc2bd6c39c2b313046c15aa9f3aca0db998bc0/cancel || true
      - id: deploy
        uses: actions/deploy-pages@v5
