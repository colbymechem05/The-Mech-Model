name: Fetch recruiting rankings

# Once a year (and by hand): women's rankings -> data/recruits. (Men's: fetch-cbbd.yml)
on:
  schedule:
    - cron: "23 14 1 10 *"   # Oct 1 every year: pick up the new freshman class
  workflow_dispatch:
    inputs:
      first:
        description: "First high-school class"
        default: "2020"
      last:
        description: "Last high-school class"
        default: "2026"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas lxml
      - name: Women's (On3 page with ESPN / On3 / 247 ranks; classes 2025+)
        run: python scripts/fetch_wbb_recruits.py 2025 $(date +%Y)
      - name: Save
        run: |
          git config user.name "meech-model-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recruits
          git diff --cached --quiet || (git commit -m "Recruiting rankings ${{ inputs.first }}-${{ inputs.last }}" && git pull --rebase -q && git push)
