name: Daily run

on:
  schedule:
    - cron: "17 13 * * *"   # 7:17 AM Central (13:17 UTC; 8:17 AM during daylight time)
  workflow_dispatch: {}      # "Run workflow" button for a manual run

permissions:
  contents: write            # lets the run save results back to the repo

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # past seasons' raw files rarely change: keep them between runs
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Rate teams and make today's lines
        run: python src/daily.py

      - name: Build dashboard data
        run: python src/export.py

      - name: Run checks
        run: python -m pytest tests -q

      - name: Save results
        run: |
          git config user.name "mech-model-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output logs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily run $(TZ=America/Chicago date +%Y-%m-%d)"
            git push
          fi
