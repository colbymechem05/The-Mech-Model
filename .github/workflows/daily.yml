name: Daily run

on:
  schedule:
    - cron: "17 13 * * *"   # 7:17 AM Central (13:17 UTC; 8:17 AM during daylight time): full run
    - cron: "47 14 * * *"   # 8:47 AM Central: backup in case GitHub skips the 7:17 run (keeps lines if already made)
    - cron: "47 21 * * *"   # 3:47 PM Central: refresh Vegas lines only (Mech lines stay as made)
  workflow_dispatch:         # "Run workflow" button for a manual run
    inputs:
      vegas_only:
        description: "Only refresh Vegas lines"
        type: boolean
        default: false
      date:
        description: "Date for Vegas lines (YYYY-MM-DD, blank = today)"
        required: false
        default: ""

permissions:
  contents: write            # lets the run save results back to the repo

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # raw files + built game tables: keep them between runs (the Vegas-only run reuses them)
      - name: Restore raw data cache
        uses: actions/cache@v6
        with:
          path: |
            data/raw
            data/games_*.csv
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Rate teams and make today's lines
        if: github.event.schedule != '47 21 * * *' && inputs.vegas_only != true
        run: python src/daily.py

      - name: Vegas lines
        run: python src/odds.py ${{ inputs.date }}

      - name: Build dashboard data
        run: python src/export.py

      - name: Run checks
        run: python -m pytest tests -q

      - name: Save results
        run: |
          git config user.name "mech-model-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output logs docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            if [ "${{ github.event.schedule }}" = "47 21 * * *" ] || [ "${{ inputs.vegas_only }}" = "true" ]; then what="Vegas refresh"; else what="Daily run"; fi
            git commit -m "$what $(TZ=America/Chicago date +%Y-%m-%d)"
            git pull --rebase -q
            git push
          fi

