name: Daily run

on:
  schedule:   # season months only (Nov-Apr); times are UTC
    - cron: "17 13 * 11,12,1,2,3,4 *"   # 7:17 AM Central (13:17 UTC; 8:17 AM during daylight time): full run
    - cron: "47 14 * 11,12,1,2,3,4 *"   # 8:47 AM Central: backup in case GitHub skips/delays the 7:17 run (keeps lines if already made)
    - cron: "47 15 * 11,12,1,2,3,4 *"   # 9:47 AM Central: second backup (e.g. a download outage)
    # Vegas-only refreshes (Meech lines stay as made). Each also saves closing lines for finished games.
    - cron: "47 17 * 11,12,1,2,3,4 *"   # 11:47 AM Central
    - cron: "47 19 * 11,12,1,2,3,4 *"   # 1:47 PM
    - cron: "47 21 * 11,12,1,2,3,4 *"   # 3:47 PM
    - cron: "47 23 * 11,12,1,2,3,4 *"   # 5:47 PM
    - cron: "47 1 * 11,12,1,2,3,4 *"    # 7:47 PM (next day in UTC; still today in Central)
    - cron: "47 4 * 11,12,1,2,3,4 *"    # 10:47 PM: closing lines for the night's early games
  workflow_dispatch:         # "Run workflow" button for a manual run
    inputs:
      vegas_only:
        description: "Only refresh Vegas lines"
        type: boolean
        default: false
      date:
        description: "Date for Vegas lines (YYYY-MM-DD, blank = today)"
        required: false
        default: ""

permissions:
  contents: write            # lets the run save results back to the repo

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Full run (morning schedules, or a manual run without "Vegas only") vs. Vegas-only refresh
      - name: Which kind of run
        id: kind
        run: |
          case "${{ github.event.schedule }}" in
            "17 13 * 11,12,1,2,3,4 *"|"47 14 * 11,12,1,2,3,4 *"|"47 15 * 11,12,1,2,3,4 *") full=true ;;
            "") if [ "${{ inputs.vegas_only }}" = "true" ]; then full=false; else full=true; fi ;;
            *) full=false ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"

      # raw files + built game tables are kept between runs; only full runs change them, so only they save
      - name: Restore raw data cache
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw
            data/games_*.csv
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Rate teams and make today's lines
        if: steps.kind.outputs.full == 'true'
        run: python src/daily.py

      - name: Save raw data cache
        if: steps.kind.outputs.full == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/raw
            data/games_*.csv
          key: raw-${{ github.run_id }}

      - name: Vegas lines
        run: python src/odds.py ${{ inputs.date }}

      - name: Build dashboard data
        run: python src/export.py

      - name: Run checks
        if: steps.kind.outputs.full == 'true'   # code only changes on pushes; data checks once a morning is enough
        run: python -m pytest tests -q

      - name: Save results
        run: |
          git config user.name "meech-model-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output logs docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            if [ "${{ steps.kind.outputs.full }}" = "true" ]; then what="Daily run"; else what="Vegas refresh"; fi
            day=$(python -c "import json; print(json.load(open('docs/data/info.json'))[0]['date'])")   # the slate, not the clock
            git commit -m "$what $day"
            git pull --rebase -q
            git push
          fi

