name: Fetch recruiting rankings (CollegeBasketballData.com)

# Men's 247Sports composite rankings via the CBBD API (key in the CBBD_API_KEY secret).
on:
  workflow_dispatch:
    inputs:
      first:
        description: "First high-school class"
        default: "2019"
      last:
        description: "Last high-school class"
        default: "2026"
      rosters:
        description: "Also fetch team rosters (for the newcomer-age test only)"
        type: boolean
        default: false
      portal:
        description: "Also fetch transfer portal entries (for the portal test only)"
        type: boolean
        default: false
  schedule:
    - cron: "37 14 1 10 *"   # Oct 1 every year: the new freshman class

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Fetch
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python -u scripts/fetch_cbbd_recruits.py ${{ inputs.first || '2019' }} ${{ inputs.last || '' }}$( [ -z "${{ inputs.last }}" ] && date +%Y )
      - name: Portal (test data)
        if: ${{ inputs.portal }}
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python -u scripts/fetch_cbbd_portal.py 2021 2026
      - name: Rosters (test data)
        if: ${{ inputs.rosters }}
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python -u scripts/fetch_cbbd_rosters.py 2021 2027
      - name: Save
        run: |
          git config user.name "meech-model-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recruits $(ls -d data/transfers data/rosters 2>/dev/null)
          git diff --cached --quiet || (git commit -m "CBBD recruiting rankings" && git pull --rebase -q && git push)
