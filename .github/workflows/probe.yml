name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python scripts/fetch_wbb_recruits.py 2025 2026
      - run: |
          git config user.name "mech-model-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recruits
          git diff --cached --quiet || (git commit -m "Women's recruiting rankings (On3 industry) 2025-2026" && git pull --rebase -q && git push)
